name: CodSpeed

# NEDEN ci.yml'de değil, ayrı dosyada: .githooks/pre-push ci.yml'deki
# `run: cargo …` satırlarını yerelde AYNEN koşuyor. `cargo codspeed` Windows'ta
# kurulu değil ve CodSpeed CLI yalnız Linux'u destekliyor; ci.yml'e girseydi
# her push yerelde kırmızı düşerdi.
#
# Kaynak: CodSpeedHQ/action examples/rust-cargo-codspeed.yml (2026-09-17).

on:
  push:
    branches: ["main"] # karşılaştırma tabanı buradan kaydedilir
  pull_request: # PR'lara performans raporu
  workflow_dispatch: # CodSpeed'in geriye dönük ilk veri üretmesi için

# Herkese açık depo: CodSpeed tokensiz yüklemeye izin veriyor, OIDC yeterli.
permissions:
  contents: read
  id-token: write

concurrency:
  group: codspeed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codspeed:
    name: Run benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # path YOK: CodSpeed yükleme adımı git kökünü $GITHUB_WORKSPACE'te arıyor.
      - uses: actions/checkout@v4

      # katla kardeş depo (`../katla`). actions/checkout workspace dışına
      # yazamaz: önce içeri alınır, sonra üst dizine taşınır (pasli-beyin
      # codspeed.yml ile aynı kalıp).
      - name: Checkout katla (path bağımlılığı)
        uses: actions/checkout@v4
        with:
          repository: Ercaner1988/katla
          path: _kardesler/katla
      - name: katla'yı ../ konumuna taşı
        run: |
          mv "$GITHUB_WORKSPACE/_kardesler/katla" "$(dirname "$GITHUB_WORKSPACE")/katla"
          rmdir "$GITHUB_WORKSPACE/_kardesler"

      - name: Setup rust toolchain, cache and cargo-codspeed binary
        uses: moonrepo/setup-rust@v0
        with:
          channel: stable
          cache-target: release
          bins: cargo-codspeed

      # `--workspace`: benchmark'lar üç derlemeye dağıldı (ibnunnedim-cli,
      # hermes-tools-core, fihrist-storage). Tek tek `-p` yazmak
      # yeni bir `[[bench]]` eklendiğinde sessizce ölçüm dışı bırakırdı.
      - name: Build the benchmark target(s)
        run: cargo codspeed build --workspace

      - name: Run the benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: cargo codspeed run --workspace
