name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: 1

# Komutlar bilerek sade: .githooks/pre-push bu dosyadaki `run: cargo …`
# satirlarini okuyup aynen calistirir. Buraya bir kontrol eklemek, yerel
# kapiya da eklemek demektir — iki listeyi el ile esitlemek gerekmez.
jobs:
  test:
    name: Test (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust"
          cache-on-failure: true
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Run tests
        run: cargo test --workspace

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust-lint"
          cache-on-failure: true
      - name: Check formatting
        run: cargo fmt --all -- --check
      # `--all-features` BİLEREK YOK: `onnx` feature'ı `fastembed` → `ort`
      # ağacını çeker ve derleme sırasında ONNX Runtime ikilisini İNDİRİR.
      # Her push'ta yüz megabaytlarca indirme, varsayılan derlemede hiç
      # kullanılmayan bir çekirdek için. ONNX bacağı yerelde denetlenir:
      #   cargo clippy --features onnx --all-targets -- -D warnings
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
