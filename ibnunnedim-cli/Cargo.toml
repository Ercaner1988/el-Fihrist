[package]
name = "ibnunnedim-cli"
version.workspace = true
edition = "2021"
license.workspace = true

[lib]
name = "ibnunnedim_cli"
path = "src/lib.rs"

[[bin]]
name = "ibnunnedim"
path = "src/main.rs"

[features]
# Varsayılan KAPALI. Açık olsaydı her derleme ONNX Runtime ikilisini indirir
# ve `ort` + `tokenizers` ağacını kurardı; `hash256` ise sıfır bağımlılık.
# Bu yüzden ci.yml'nin clippy satırında `--all-features` YOK.
onnx = ["dep:fastembed"]

[dependencies]
turso.workspace = true
katla.workspace = true
terim.workspace = true
# ONNX gömme çekirdeği (multilingual-e5-small, 384 boyut). Yalnız `--features onnx`.
fastembed = { version = "4.9", optional = true }
# bge-embed-rs / llama-server'ın yerel /v1/embeddings uç noktası için: yalnız
# 127.0.0.1'e konuşur, TLS gerekmez — varsayılan özellikler kapalı.
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
# CodSpeed uyumluluk katmanı, `divan` adıyla. `cargo codspeed` dışında düz
# divan gibi davranır; ikiliye girmez (yalnız dev).
divan = { package = "codspeed-divan-compat", version = "5.0.1" }

[[bench]]
name = "arama"
harness = false

[[bench]]
name = "gomme"
harness = false
