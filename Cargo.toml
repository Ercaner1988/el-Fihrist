[workspace]
members = [
    "ibnunnedim-cli",
    "crates/hermes-tools-core",
    "crates/fihrist-core",
    "crates/fihrist-storage",
    "crates/fihrist-gui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
turso = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.43", features = ["full"] }
tracing = "0.1"
thiserror = "2.0"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
fihrist-core = { path = "crates/fihrist-core" }
fihrist-storage = { path = "crates/fihrist-storage" }

