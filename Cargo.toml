[workspace]
members = [
    "ibnunnedim-cli",
    "crates/hermes-tools-core",
    "crates/fihrist-core",
    "crates/fihrist-storage",
    "crates/fihrist-gui",
    "crates/terim",
    "crates/fihrist-tema",
    "crates/fihrist-canli",
    "crates/fihrist-nazar",
    "crates/fihrist-kaynak",
    "crates/fihrist-olcum",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
turso = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.43", features = ["full"] }
tracing = "0.1"
thiserror = "2.0"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "glow", "x11", "wayland", "accesskit"] }
fihrist-core = { path = "crates/fihrist-core" }
fihrist-storage = { path = "crates/fihrist-storage" }
# Ortak Türkçe katlama (pasli-beyin de kullanır). Kardeş repo: ../katla
katla = { path = "../katla" }
terim = { path = "crates/terim" }
# Tema paketi sema ve TemaKaynagi sozlesmesi (ortak crate). git + rev: fihrist-tema
# baska depolardan git ile cekilince kardes yol (../kilim-tema) orada yok.
kilim-tema = { git = "https://github.com/Ercaner1988/kilim-tema", rev = "a62bfc71227202fe1173b8f9d36aaa723fd5a12c" }
fihrist-tema = { path = "crates/fihrist-tema" }
# Nazar (yerel dosya içeriği araması). Kardeş repo: ../Nazar
nazar-istemci = { path = "../Nazar/crates/nazar-istemci" }
fihrist-nazar = { path = "crates/fihrist-nazar" }
fihrist-canli = { path = "crates/fihrist-canli" }
fihrist-kaynak = { path = "crates/fihrist-kaynak" }
fihrist-olcum = { path = "crates/fihrist-olcum" }

